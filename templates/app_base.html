<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <title>{% block title %}LaunchPad{% endblock %}</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/dashboard">
          <span class="brand-mark">🚀</span><span class="brand-name">LaunchPad</span>
        </a>
        <nav class="main-nav">
          <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' else '' }}">Dashboard</a>
          <a href="/tasks-page" class="{{ 'active' if request.path == '/tasks-page' else '' }}">Tasks</a>
          <a href="/help-page" class="{{ 'active' if request.path == '/help-page' else '' }}">Help Feed</a>
          <a href="/profile-page" class="{{ 'active' if request.path == '/profile-page' else '' }}">Profile</a>
        </nav>
        <form method="POST" action="/logout" class="logout-form">
          <button class="btn-ghost" type="submit">Log out</button>
        </form>
      </div>
    </header>
    <main class="container{% block container_extra %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
