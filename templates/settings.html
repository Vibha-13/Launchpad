{% extends "app_base.html" %}
{% block title %}Settings — LaunchPad{% endblock %}
{% block container_extra %} narrow{% endblock %}
{% block content %}
<div class="dash-header">
  <h1 class="dash-greeting">Settings</h1>
  <p class="dash-sub">Manage your profile and account.</p>
</div>

<div class="card">
  <h3>Profile</h3>
  <div id="profile-error"></div>
  <form class="stack" id="profile-form">
    <label class="meta">Name</label>
    <input type="text" id="settings-name" required>
    <label class="meta">Email</label>
    <input type="email" id="settings-email" disabled style="opacity:0.6;">
    <button type="submit" style="align-self:flex-start;">Save changes</button>
  </form>
</div>

<div class="card">
  <h3>Change password</h3>
  <div id="password-error"></div>
  <form class="stack" id="password-form">
    <label class="meta">Current password</label>
    <input type="password" id="current-password" required>
    <label class="meta">New password</label>
    <input type="password" id="new-password" required minlength="8">
    <button type="submit" style="align-self:flex-start;">Update password</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function loadSettings() {
    const res = await fetch('/me');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const data = await res.json();
    document.getElementById('settings-name').value = data.user.name;
    document.getElementById('settings-email').value = data.user.email;
  }

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('settings-name').value.trim();
    const errorBox = document.getElementById('profile-error');
    errorBox.innerHTML = '';
    const res = await fetch('/api/settings/profile', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const result = await res.json();
    if (!res.ok) {
      errorBox.innerHTML = `<p class="error">${escapeHtml(result.error)}</p>`;
      return;
    }
    showToast('Profile updated', 'success');
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const current_password = document.getElementById('current-password').value;
    const new_password = document.getElementById('new-password').value;
    const errorBox = document.getElementById('password-error');
    errorBox.innerHTML = '';
    const res = await fetch('/api/settings/password', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current_password, new_password })
    });
    const result = await res.json();
    if (!res.ok) {
      errorBox.innerHTML = `<p class="error">${escapeHtml(result.error)}</p>`;
      return;
    }
    document.getElementById('current-password').value = '';
    document.getElementById('new-password').value = '';
    showToast('Password updated', 'success');
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadSettings();
</script>
{% endblock %}
